[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sabah-rail-model"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
actions = ["XlsxWriter>=3.2,<4", "cryptography>=44,<47"]
test = ["httpx>=0.27,<1"]
ingest = ["openpyxl>=3.1,<4", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
include = ["railmodel*"]

[tool.setuptools.package-data]
railmodel = ["web/*.html"]
