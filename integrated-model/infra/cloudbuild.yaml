steps:
  - name: python:3.12-slim
    entrypoint: bash
    args: ['-c', 'pip install .[test] && python -m unittest discover -s tests -v']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE_URI}', '.']
images: ['${_IMAGE_URI}']
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE_URI: 'REGION-docker.pkg.dev/PROJECT/REPOSITORY/sabah-rail-model:VERSION'
