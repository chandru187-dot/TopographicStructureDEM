name: Check Esri Imagery Sabah Rail

on:
  push:
    branches: [sabah-rail-hires-imagery]
    paths:
      - "tools/check_esri_sabah_imagery.py"
      - ".github/workflows/check-esri-sabah-imagery.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/check_esri_sabah_imagery.py
