name: Sabah model code tests
on:
  push:
    branches: [sabah-rail-model-v0.2.0]
    paths: ['integrated-model/**', '.github/workflows/sabah-model-tests.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrated-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .[test]
      - run: python -m unittest discover -s tests -v
