name: Build Shah Alam DEM Map

on:
  push:
    branches:
      - shah-alam-map
    paths:
      - "tools/shah_alam_dem_map.py"
      - "requirements-map.txt"
      - ".github/workflows/shah-alam-dem.yml"
  workflow_dispatch:

jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-map.txt

      - name: Build Shah Alam DEM map
        run: |
          python tools/shah_alam_dem_map.py --output output/shah_alam --zoom 13

      - name: List outputs
        run: |
          find output/shah_alam -maxdepth 1 -type f -printf "%f %s bytes\n"

      - name: Upload map package
        uses: actions/upload-artifact@v4
        with:
          name: shah-alam-dem-map
          path: output/shah_alam/
          if-no-files-found: error
          retention-days: 30
