name: Check Sabah Rail Open Aerial Imagery

on:
  push:
    branches: [sabah-rail-hires-imagery]
    paths:
      - "tools/check_sabah_oam.py"
      - ".github/workflows/check-sabah-oam.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/check_sabah_oam.py
      - uses: actions/upload-artifact@v4
        with:
          name: sabah-oam-check
          path: oam_sabah_results.json
          retention-days: 7
