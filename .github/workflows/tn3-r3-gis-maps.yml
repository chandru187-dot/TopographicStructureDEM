name: Build TN3 R3 GIS Maps

on:
  push:
    branches:
      - sabah-rail-hires-imagery
    paths:
      - "tools/tn3_r3_gis_maps.py"
      - ".github/workflows/tn3-r3-gis-maps.yml"
      - "data/Sabah_Rail_Study_Area_and_Alignment.geojson"
      - "requirements-infrastructure-map.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: sabah-rail-hires-imagery
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-infrastructure-map.txt

      - name: Build TN3 R3 GIS maps
        run: |
          python tools/tn3_r3_gis_maps.py

      - name: Recover approved Esri satellite overview from successful imagery run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/tn3_esri_artifact
          gh run download 36529821320             --repo "${{ github.repository }}"             --name Esri_Cloud_Presentation_Images_and_Metadata             --dir /tmp/tn3_esri_artifact
          IMG=$(find /tmp/tn3_esri_artifact -type f -name 'Sabah_Rail_Satellite_Overall_With_Alignment.jpg' | head -n 1)
          if [ -n "$IMG" ]; then
            cp "$IMG" output/tn3_r3_gis/TN3_R3_Satellite_Overview_With_Alignment.jpg
          else
            echo "Satellite overview not found in source artifact" >&2
            exit 1
          fi

      - name: Verify outputs
        run: |
          test -s output/tn3_r3_gis/TN3_R3_Study_Corridor_Existing_Infrastructure.png
          test -s output/tn3_r3_gis/TN3_R3_Traffic_Survey_Locations.png
          test -s output/tn3_r3_gis/TN3_R3_Freight_Market_Nodes.png
          test -s output/tn3_r3_gis/TN3_R3_Satellite_Overview_With_Alignment.jpg
          find output/tn3_r3_gis -maxdepth 1 -type f -printf "%f %s bytes\n"

      - name: Commit generated TN3 map package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/tn3_r3_gis/
          if git diff --cached --quiet; then
            echo "No TN3 GIS output changes to commit."
          else
            git commit -m "Generate TN3 R3 GIS map package"
            git push origin HEAD:sabah-rail-hires-imagery
          fi

      - name: Upload TN3 GIS map package
        uses: actions/upload-artifact@v4
        with:
          name: TN3_R3_GIS_Map_Package
          path: output/tn3_r3_gis/
          if-no-files-found: error
          retention-days: 30
