name: Build Sabah Rail Esri High-Resolution Imagery

on:
  workflow_dispatch:
  push:
    branches:
      - sabah-rail-hires-imagery
    paths:
      - "data/Sabah_Rail_Study_Area_and_Alignment.geojson"
      - "tools/sabah_rail_esri_hires_imagery.py"
      - "requirements-esri-hires-imagery.txt"
      - ".github/workflows/sabah-rail-esri-hires-imagery.yml"

permissions:
  contents: read

concurrency:
  group: sabah-rail-hires-imagery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-esri-hires-imagery.txt

      - name: Select build mode
        id: build_mode
        shell: bash
        run: |
          if [ -n "$ARCGIS_API_KEY" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "authenticated=true" >> "$GITHUB_OUTPUT"
            echo "ArcGIS credential detected: building presentation plus authorized offline tile package."
          else
            echo "mode=presentation" >> "$GITHUB_OUTPUT"
            echo "authenticated=false" >> "$GITHUB_OUTPUT"
            echo "No ARCGIS_API_KEY configured: building public imagery audit and 8K presentation preview only."
          fi

      - name: Build Sabah Rail imagery package
        run: |
          python tools/sabah_rail_esri_hires_imagery.py             --mode "${{ steps.build_mode.outputs.mode }}"             --buffer-m 3000             --maximum-level 19

      - name: Verify public imagery outputs
        run: |
          output_dir="output/sabah_rail_esri_hires"
          test -s "$output_dir/Sabah_Rail_HighRes_Satellite_Presentation_8K.png"
          test -s "$output_dir/Sabah_Rail_HighRes_Satellite_Presentation_8K_Boundary.png"
          test -s "$output_dir/Sabah_Rail_Esri_Imagery_Coverage_Audit.json"
          test -s "$output_dir/Sabah_Rail_Esri_Imagery_Coverage_Samples.csv"
          test -s "$output_dir/Sabah_Rail_HighRes_Satellite_Metadata.json"
          test -s "$output_dir/Sabah_Rail_HighRes_Satellite_Imagery_Package.zip"
          find "$output_dir" -maxdepth 1 -type f -printf "%f %s bytes\n"
          python - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path("output/sabah_rail_esri_hires")
          meta = json.loads((root / "Sabah_Rail_HighRes_Satellite_Metadata.json").read_text())
          assert meta["coverage_audit"]["uncovered_sample_count"] == 0
          assert meta["coverage_audit"]["failed_query_count"] == 0
          assert meta["presentation_export"]["width_px"] == 8192
          package = root / "Sabah_Rail_HighRes_Satellite_Imagery_Package.zip"
          assert zipfile.is_zipfile(package)
          PY

      - name: Verify authorized offline export
        if: steps.build_mode.outputs.authenticated == 'true'
        run: |
          output_dir="output/sabah_rail_esri_hires"
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("output/sabah_rail_esri_hires")
          meta = json.loads((root / "Sabah_Rail_HighRes_Satellite_Metadata.json").read_text())
          assert meta["authenticated_offline_export"]["authenticated"] is True
          assert list(root.glob("*.tpk*")), "Authorized tile package is missing"
          PY

      - name: Upload Sabah Rail imagery package
        uses: actions/upload-artifact@v4
        with:
          name: Sabah_Rail_HighRes_Satellite_Imagery_Package
          path: output/sabah_rail_esri_hires/
          if-no-files-found: error
          retention-days: 30
